authors = [
    { email = "claramariekatharina.2013@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "geopandas>=1.2.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.1.0",
    "rasterio>=1.4.4",
